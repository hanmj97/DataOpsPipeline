# STEP 26-2. Kubernetes Job 실습
#
# 목적:
# 1. Job 생성
# 2. Pod 자동 생성 확인
# 3. 컨테이너 명령 실행
# 4. 작업 성공 상태 및 로그 확인

apiVersion: batch/v1
kind: Job

metadata:
  name: dataops-hello-job
  namespace: dataops

spec:
  # 작업을 성공적으로 완료해야 하는 횟수
  completions: 1

  # 동시에 실행할 Pod 개수
  parallelism: 1

  # 실패한 Pod 재시도 허용 횟수
  backoffLimit: 2

  template:
    spec:
      containers:
        - name: hello-container

          # 실습용 경량 Linux 이미지
          image: busybox:1.36.1

          # 컨테이너에서 실행할 명령어
          command:
            - sh
            - -c

          args:
            - |
              echo "================================="
              echo "DataOps Kubernetes Job Started"
              echo "================================="

              echo "Current Date:"
              date

              echo "Simulating ETL Process..."

              sleep 3

              echo "ETL Process Completed Successfully"

      # 컨테이너 실패 시 Pod 내부에서 재시작하지 않음
      # 실패 처리는 Job 컨트롤러가 담당
      restartPolicy: Never
